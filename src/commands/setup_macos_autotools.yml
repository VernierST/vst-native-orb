description: >
  Installs autotools on macos.
steps:
  - run:
      name: Install libtool
      command: brew install --no-ask libtool
  - run:
      name: Install pkg-config
      command: brew install --no-ask pkg-config
  - run:
      name: Install Zlib
      command: brew install --no-ask zlib
  - run:
      name: Install automake
      command: brew install --no-ask automake
